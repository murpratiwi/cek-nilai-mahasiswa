<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Nilai Mahasiswa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px 32px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header .icon {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff;
  }
  h1 { color: #2d3748; font-size: 24px; margin-bottom: 6px; }
  .subtitle { color: #718096; font-size: 14px; }
  .form-group { margin-bottom: 20px; }
  label {
    display: block; color: #4a5568; font-weight: 600;
    margin-bottom: 8px; font-size: 14px;
  }
  input {
    width: 100%; padding: 14px 16px;
    border: 2px solid #e2e8f0; border-radius: 10px;
    font-size: 15px; transition: all 0.2s;
  }
  input[type="text"] { text-transform: uppercase; letter-spacing: 0.5px; }
  input:focus {
    outline: none; border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
  }
  button:active { transform: translateY(0); }
  .result {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    text-align: center; display: none;
    animation: fadeIn 0.4s ease;
  }
  .result.show { display: block; }
  .result.lulus {
    background: linear-gradient(135deg, #d4f4dd, #a8e6b8);
    border: 2px solid #38a169;
  }
  .result.remed {
    background: linear-gradient(135deg, #fed7d7, #feb2b2);
    border: 2px solid #e53e3e;
  }
  .result.error { background: #fefcbf; border: 2px solid #d69e2e; }
  .result .emoji { font-size: 48px; margin-bottom: 10px; }
  .result .name {
    font-size: 16px; font-weight: 600;
    color: #2d3748; margin-bottom: 4px;
  }
  .result .nilai { font-size: 32px; font-weight: 700; margin: 8px 0; }
  .result.lulus .nilai { color: #22543d; }
  .result.remed .nilai { color: #742a2a; }
  .result .message { font-size: 16px; font-weight: 600; margin-top: 6px; }
  .result.lulus .message { color: #22543d; }
  .result.remed .message { color: #742a2a; }
  .result.error .message { color: #744210; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .info {
    margin-top: 20px; padding: 12px;
    background: #f7fafc; border-radius: 8px;
    font-size: 13px; color: #718096; text-align: center;
  }
  .hidden { display: none; }
  .lock-badge {
    display: inline-block;
    background: #38a169; color: #fff;
    font-size: 12px; padding: 4px 10px;
    border-radius: 20px; margin-bottom: 10px;
  }
  .error-msg {
    color: #e53e3e; font-size: 13px;
    margin-top: 8px; text-align: center;
    min-height: 18px;
  }
</style>
</head>
<body>
  <div class="container" id="loginPage">
    <div class="header">
      <div class="icon">🔒</div>
      <h1>Halaman Terkunci</h1>
      <p class="subtitle">Masukkan password untuk mengakses data nilai</p>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="off">
    </div>
    <button onclick="bukaKunci()">Buka 🔓</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="container hidden" id="mainPage">
    <div class="header">
      <span class="lock-badge">🔓 Terbuka</span>
      <div class="icon">📊</div>
      <h1>Cek Nilai Mahasiswa</h1>
      <p class="subtitle">Masukkan NIM untuk melihat hasil nilai Anda</p>
    </div>
    <div class="form-group">
      <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
      <input type="text" id="nim" placeholder="Contoh: F1D02510015" autocomplete="off">
    </div>
    <button onclick="cekNilai()">Cek Nilai</button>
    <div id="result" class="result"></div>
    <div class="info">💡 Nilai minimal kelulusan: <strong>65</strong></div>
  </div>

<script>
  // Data nilai dienkripsi otomatis di memory saat halaman dimuat
  // Password: dosen2025
  let encryptedData = null;
  let dataNilai = null;

  (function init() {
    const dataAsli = {
      "F1D022149":   { nama: "NABILA AZKIYA ROSYIDA WIJAYANTI", nilai: 60 },
      "F1D02310010": { nama: "I NYOMAN SUDARSANA", nilai: 70 },
      "F1D02310012": { nama: "KHOLIQ MITRA RAHARJA", nilai: 55 },
      "F1D02310024": { nama: "ROMAN IBRAHIMA ARCHISAPPE CHARENI", nilai: 47 },
      "F1D02310053": { nama: "GIAN KAUSARI", nilai: 60 },
      "F1D02310056": { nama: "I MADE INDRA DWI PAYANA", nilai: 70 },
      "F1D02310067": { nama: "KEVIN MUAMMAR GATHFAN", nilai: 50 },
      "F1D02310074": { nama: "M. RIZKI JUNIARDI", nilai: 60 },
      "F1D02510015": { nama: "MICHEL ISKANDAR", nilai: 75 },
      "F1D02510034": { nama: "AGNI HUMAIRA", nilai: 45 },
      "F1D02510038": { nama: "ANAS AMRULLAH KHAERON", nilai: 50 },
      "F1D02510040": { nama: "AZZAHRA SHAFIRA RACHMAN", nilai: 60 },
      "F1D02510043": { nama: "BAYU KHALDUN ARDIANSYAH", nilai: 40 },
      "F1D02510044": { nama: "CAYLAZEFA GRACIA GETSEMANI ARIO", nilai: 70 },
      "F1D02510047": { nama: "DAHLIA WAHYUNI", nilai: 65 },
      "F1D02510050": { nama: "FAIZ GAIA NAJIB", nilai: 40 },
      "F1D02510054": { nama: "I GUSTI AGUNG AYU PRISILIA", nilai: 60 },
      "F1D02510055": { nama: "I KOMANG SATYA BAGUS TRIATNA", nilai: 70 },
      "F1D02510061": { nama: "JOVANKA KIARA REVALIN SEPTYAVANYA", nilai: 65 },
      "F1D02510065": { nama: "LALU AKHADI RIZKI", nilai: 60 },
      "F1D02510067": { nama: "LALU MUHAMMAD IZZA ABDA MAULANA", nilai: 65 },
      "F1D02510070": { nama: "M. PRADIFTA ARIZONA", nilai: 45 },
      "F1D02510071": { nama: "MALIKAL HIRSYA ALFATORY", nilai: 55 },
      "F1D02510072": { nama: "MAULANA ISNA ANDIKA", nilai: 40 },
      "F1D02510076": { nama: "MOHAMMAD IVAN ANDITA", nilai: 60 },
      "F1D02510082": { nama: "MUHAMMAD FEBRYAN SYACH FAHLEVI", nilai: 45 },
      "F1D02510084": { nama: "MUHAMMAD SATRIA RAHMATUL ADHA", nilai: 50 },
      "F1D02510087": { nama: "NISA AGNIA", nilai: 60 },
      "F1D02510089": { nama: "RIFKA SALSABILA FUTRI", nilai: 90 },
      "F1D02510096": { nama: "VIRGINIA SHERINA MARTHA PIRI", nilai: 80 },
      "F1D02510097": { nama: "YARA DZAKIYATUL FITRIYAH", nilai: 50 },
      "F1D02510100": { nama: "ZIDNY ILMA", nilai: 65 },
      "F1D02510103": { nama: "AMANDA REZQUITA JAMILA", nilai: 80 },
      "F1D02510108": { nama: "BIMA SATRIO KHOIRI ROMADHON", nilai: 50 },
      "F1D02510109": { nama: "CHANDRA KUSUMA", nilai: 40 },
      "F1D02510113": { nama: "FAUZAN ADHIM MUBARAK", nilai: 40 },
      "F1D02510119": { nama: "LALU HELMI FIRDAUS", nilai: 50 },
      "F1D02510120": { nama: "LALU M. SULTHAN AZMY", nilai: 40 },
      "F1D02510125": { nama: "MUSHADDIK SYAKH AL KABIIRA", nilai: 20 },
      "F1D02510128": { nama: "NATHAN CHRISTIAN LOILEWEN", nilai: 90 },
      "F1D02511001": { nama: "Aijiazi Housaiyin", nilai: 45 }
    };
    encryptedData = CryptoJS.AES.encrypt(JSON.stringify(dataAsli), "dosen2025").toString();
  })();

  function bukaKunci() {
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!password) {
      errorMsg.textContent = '⚠️ Password tidak boleh kosong';
      return;
    }

    try {
      const bytes = CryptoJS.AES.decrypt(encryptedData, password);
      const decrypted = bytes.toString(CryptoJS.enc.Utf8);
      if (!decrypted) throw new Error('Password salah');

      dataNilai = JSON.parse(decrypted);
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('mainPage').classList.remove('hidden');
      setTimeout(function() { document.getElementById('nim').focus(); }, 100);
    } catch (e) {
      errorMsg.textContent = '❌ Password salah, silakan coba lagi';
      document.getElementById('password').value = '';
    }
  }

  function cekNilai() {
    const nimInput = document.getElementById('nim').value.trim().toUpperCase();
    const resultDiv = document.getElementById('result');
    resultDiv.className = 'result';

    if (!nimInput) {
      resultDiv.classList.add('show', 'error');
      resultDiv.innerHTML = '<div class="emoji">⚠️</div><div class="message">NIM tidak boleh kosong!</div>';
      return;
    }

    const data = dataNilai[nimInput];

    if (!data) {
      resultDiv.classList.add('show', 'error');
      resultDiv.innerHTML = '<div class="emoji">❌</div><div class="message">NIM tidak ditemukan dalam data!</div>';
      return;
    }

    if (data.nilai >= 65) {
      resultDiv.classList.add('show', 'lulus');
      resultDiv.innerHTML =
        '<div class="emoji">🎉</div>' +
        '<div class="name">' + data.nama + '</div>' +
        '<div class="nilai">' + data.nilai + '</div>' +
        '<div class="message">Selamat, kamu tidak remed! 🎓</div>';
    } else {
      resultDiv.classList.add('show', 'remed');
      resultDiv.innerHTML =
        '<div class="emoji">😔</div>' +
        '<div class="name">' + data.nama + '</div>' +
        '<div class="nilai">' + data.nilai + '</div>' +
        '<div class="message">Maaf, coba lagi yuk. Remed! 📚</div>';
    }
  }

  document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') bukaKunci();
  });
  document.getElementById('nim').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') cekNilai();
  });
</script>
</body>
</html>
