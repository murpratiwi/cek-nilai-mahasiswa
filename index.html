<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Checker – Probability & Statistics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px 32px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header .icon {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff;
  }
  h1 { color: #2d3748; font-size: 24px; margin-bottom: 6px; }
  .subtitle { color: #718096; font-size: 14px; }
  .form-group { margin-bottom: 20px; }
  label {
    display: block; color: #4a5568; font-weight: 600;
    margin-bottom: 8px; font-size: 14px;
  }
  input[type="text"] {
    width: 100%; padding: 14px 16px;
    border: 2px solid #e2e8f0; border-radius: 10px;
    font-size: 15px; font-family: 'DM Mono', monospace;
    transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"]:focus {
    outline: none; border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
  }
  button:active { transform: translateY(0); }
  .result {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    text-align: center; display: none;
    animation: fadeIn 0.4s ease;
  }
  .result.show { display: block; }
  .result.passed {
    background: linear-gradient(135deg, #d4f4dd, #a8e6b8);
    border: 2px solid #38a169;
  }
  .result.failed {
    background: linear-gradient(135deg, #fed7d7, #feb2b2);
    border: 2px solid #e53e3e;
  }
  .result.error { background: #fefcbf; border: 2px solid #d69e2e; }
  .result .emoji { font-size: 48px; margin-bottom: 10px; }
  .result .name {
    font-size: 16px; font-weight: 600;
    color: #2d3748; margin-bottom: 4px;
  }
  .result .score { font-size: 32px; font-weight: 700; margin: 8px 0; font-family: 'DM Mono', monospace; }
  .result.passed .score { color: #22543d; }
  .result.failed .score { color: #742a2a; }
  .result .message { font-size: 16px; font-weight: 600; margin-top: 6px; }
  .result.passed .message { color: #22543d; }
  .result.failed .message { color: #742a2a; }
  .result.error .message { color: #744210; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .info {
    margin-top: 20px; padding: 12px;
    background: #f7fafc; border-radius: 8px;
    font-size: 13px; color: #718096; text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">📊</div>
      <h1>Student Grade Checker</h1>
      <p class="subtitle">Probability &amp; Statistics — Class A</p>
    </div>
    <div class="form-group">
      <label for="nim">Student ID Number (NIM)</label>
      <input type="text" id="nim" placeholder="Example: F1D02510015" autocomplete="off">
    </div>
    <button onclick="checkGrade()">Check Grade</button>
    <div id="result" class="result"></div>
    <div class="info">💡 Minimum passing score: <strong>65</strong></div>
  </div>

<script>
  const gradeData = {
    "F1D022149":   { name: "NABILA AZKIYA ROSYIDA WIJAYANTI", score: 60 },
    "F1D02310010": { name: "I NYOMAN SUDARSANA", score: 70 },
    "F1D02310012": { name: "KHOLIQ MITRA RAHARJA", score: 55 },
    "F1D02310024": { name: "ROMAN IBRAHIMA ARCHISAPPE CHARENI", score: 47 },
    "F1D02310053": { name: "GIAN KAUSARI", score: 60 },
    "F1D02310056": { name: "I MADE INDRA DWI PAYANA", score: 70 },
    "F1D02310067": { name: "KEVIN MUAMMAR GATHFAN", score: 50 },
    "F1D02310074": { name: "M. RIZKI JUNIARDI", score: 60 },
    "F1D02510015": { name: "MICHEL ISKANDAR", score: 75 },
    "F1D02510034": { name: "AGNI HUMAIRA", score: 45 },
    "F1D02510038": { name: "ANAS AMRULLAH KHAERON", score: 50 },
    "F1D02510040": { name: "AZZAHRA SHAFIRA RACHMAN", score: 60 },
    "F1D02510043": { name: "BAYU KHALDUN ARDIANSYAH", score: 40 },
    "F1D02510044": { name: "CAYLAZEFA GRACIA GETSEMANI ARIO", score: 70 },
    "F1D02510047": { name: "DAHLIA WAHYUNI", score: 65 },
    "F1D02510050": { name: "FAIZ GAIA NAJIB", score: 40 },
    "F1D02510054": { name: "I GUSTI AGUNG AYU PRISILIA", score: 60 },
    "F1D02510055": { name: "I KOMANG SATYA BAGUS TRIATNA", score: 70 },
    "F1D02510061": { name: "JOVANKA KIARA REVALIN SEPTYAVANYA", score: 65 },
    "F1D02510065": { name: "LALU AKHADI RIZKI", score: 60 },
    "F1D02510067": { name: "LALU MUHAMMAD IZZA ABDA MAULANA", score: 65 },
    "F1D02510070": { name: "M. PRADIFTA ARIZONA", score: 45 },
    "F1D02510071": { name: "MALIKAL HIRSYA ALFATORY", score: 55 },
    "F1D02510072": { name: "MAULANA ISNA ANDIKA", score: 40 },
    "F1D02510076": { name: "MOHAMMAD IVAN ANDITA", score: 60 },
    "F1D02510082": { name: "MUHAMMAD FEBRYAN SYACH FAHLEVI", score: 45 },
    "F1D02510084": { name: "MUHAMMAD SATRIA RAHMATUL ADHA", score: 50 },
    "F1D02510087": { name: "NISA AGNIA", score: 60 },
    "F1D02510089": { name: "RIFKA SALSABILA FUTRI", score: 90 },
    "F1D02510096": { name: "VIRGINIA SHERINA MARTHA PIRI", score: 80 },
    "F1D02510097": { name: "YARA DZAKIYATUL FITRIYAH", score: 50 },
    "F1D02510100": { name: "ZIDNY ILMA", score: 65 },
    "F1D02510103": { name: "AMANDA REZQUITA JAMILA", score: 80 },
    "F1D02510108": { name: "BIMA SATRIO KHOIRI ROMADHON", score: 50 },
    "F1D02510109": { name: "CHANDRA KUSUMA", score: 40 },
    "F1D02510113": { name: "FAUZAN ADHIM MUBARAK", score: 40 },
    "F1D02510119": { name: "LALU HELMI FIRDAUS", score: 50 },
    "F1D02510120": { name: "LALU M. SULTHAN AZMY", score: 40 },
    "F1D02510125": { name: "MUSHADDIK SYAKH AL KABIIRA", score: 20 },
    "F1D02510128": { name: "NATHAN CHRISTIAN LOILEWEN", score: 90 },
    "F1D02511001": { name: "Aijiazi Housaiyin", score: 45 }
  };

  function checkGrade() {
    const nimInput = document.getElementById('nim').value.trim().toUpperCase();
    const resultDiv = document.getElementById('result');
    resultDiv.className = 'result';

    if (!nimInput) {
      resultDiv.classList.add('show', 'error');
      resultDiv.innerHTML = '<div class="emoji">⚠️</div><div class="message">Student ID cannot be empty!</div>';
      return;
    }

    const data = gradeData[nimInput];

    if (!data) {
      resultDiv.classList.add('show', 'error');
      resultDiv.innerHTML = '<div class="emoji">❌</div><div class="message">Student ID not found in the records!</div>';
      return;
    }

    if (data.score >= 65) {
      resultDiv.classList.add('show', 'passed');
      resultDiv.innerHTML =
        '<div class="emoji">🎉</div>' +
        '<div class="name">' + data.name + '</div>' +
        '<div class="score">' + data.score + '</div>' +
        '<div class="message">Congratulations, you passed! 🎓</div>';
    } else {
      resultDiv.classList.add('show', 'failed');
      resultDiv.innerHTML =
        '<div class="emoji">😔</div>' +
        '<div class="name">' + data.name + '</div>' +
        '<div class="score">' + data.score + '</div>' +
        '<div class="message">You did not pass. Keep trying! 📚</div>';
    }
  }

  document.getElementById('nim').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkGrade();
  });
</script>
</body>
</html>
